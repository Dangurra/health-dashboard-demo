<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>My Health · phone</title>
<link rel="stylesheet" href="/device.css">
<script src="/device.js"></script>
</head>
<body>
<!-- The live demo app, shown at iPhone size inside a phone frame, for screen recordings. -->
<div class="stage"><div class="fit" id="fit">
<div class="device" id="phone">
  <div class="bezel">
    <div class="screen">
      <div class="status"><span class="time" id="clock">9:41</span><span class="island" aria-hidden="true"></span><span class="icons" aria-hidden="true">
        <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.5 6.9a6.4 6.4 0 0 1 9 0L11.1 8.3a4.4 4.4 0 0 0-6.2 0zM1.3 4.7a9.5 9.5 0 0 1 13.4 0l-1.4 1.4a7.5 7.5 0 0 0-10.6 0z"/></svg>
        <svg viewBox="0 0 27 13" width="27" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" opacity=".5"/></svg>
      </span></div>
      <iframe id="app" src="/#today" title="My Health on a phone"></iframe>
      <div class="home-bar" aria-hidden="true"></div>
    </div>
  </div>
</div>
</div></div>
<div class="ctl">Live demo · synthetic data · <kbd>H</kbd> hides this</div>
<script>
  { const q=new URLSearchParams(location.search); if(q.has('bare')) document.body.classList.add('bare'); if(q.get('only')) document.body.classList.add('only-'+q.get('only')); }
  frameApp(document.getElementById('app'), true);
  // Status-bar clock shows the real time
  const c=document.getElementById('clock'), tick=()=>{ const d=new Date(); c.textContent=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,'0')}`; };
  tick(); setInterval(tick, 15000);
  // Open on a specific page with phone.html#gym
  if(location.hash.length>1) document.getElementById('app').src='/'+location.hash;
  // Scale the phone to fit the window (never above actual size)
  const fit=document.getElementById('fit'), size=()=>{ const s=Math.min(1,(innerHeight-48)/880,(innerWidth-48)/421); fit.style.transform=`scale(${s})`; };
  addEventListener('resize',size); size();
  addEventListener('keydown',e=>{ if(e.key==='h'||e.key==='H') document.body.classList.toggle('clean'); });
  const app=document.getElementById('app'); app.addEventListener('load',()=>app.contentWindow.addEventListener('keydown',e=>{ if((e.key==='h'||e.key==='H') && !e.target.closest('input,textarea,select,[contenteditable]')) document.body.classList.toggle('clean'); }));
</script>
</body>
</html>
